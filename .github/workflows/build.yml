name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in *.zip; do unzip -q -o "$f"; done
      - run: sed -i '/cancelDiscovery/d' CmfBuds/app/src/main/java/com/cmf/buds/BudsClient.kt
      - run: sed -i 's/Dispatchers.IO)/Dispatchers.IO + kotlinx.coroutines.CoroutineExceptionHandler { _, e -> log(e.toString()) })/' CmfBuds/app/src/main/java/com/cmf/buds/BudsClient.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: CmfBuds
      - uses: actions/upload-artifact@v4
        with:
          name: CMF-Buds-apk
          path: CmfBuds/app/build/outputs/apk/debug/app-debug.apk
